services:
  ollama:
    image: ollama/ollama:latest
    gpus: "all"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list; do sleep 2; done
        ollama pull llama3.1
        ollama pull d1-omni:latest
    volumes:
      - ollama_data:/root/.ollama

  app:
    build:
      context: ./01
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: http://ollama:11434
    stdin_open: true
    tty: true

  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp
    init: true
    ports:
      - "8931:8931"
    entrypoint: ["node"]
    command:
      - /app/cli.js
      - --headless
      - --browser
      - chromium
      - --no-sandbox
      - --port
      - "8931"
      - --host
      - 0.0.0.0
      - --allowed-hosts
      - "*"
    shm_size: 2gb
    restart: unless-stopped

volumes:
  ollama_data:
